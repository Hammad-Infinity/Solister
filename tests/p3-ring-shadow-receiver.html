<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P3 — ring-shadow receiver GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script src="../src/shaders/ring-shadow-receiver.glsl.js"></script>
<script>
  globalThis.__RING_SHADOW_RECEIVER_GLSL = ringShadowReceiverGlsl();
</script>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P3 ring-shadow receiver starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { ringShadowReceiverFactor } from "../src/shaders/ring-shadow-receiver.tsl.js";
import * as THREE from "three";
import {
  Scene as NodeScene,
  OrthographicCamera as NodeOrthographicCamera,
  PlaneGeometry as NodePlaneGeometry,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  REVISION
} from "three/webgpu";
import { uv, vec3, vec4, float } from "three/tsl";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");
const CASES = [
  { center: [0, 0, 0], normal: [0, 1, 0], sun: [4, 5, 2], darkness: 0.85, bands: [[1.2, 1.8], [2.2, 3.0]] },
  { center: [0, 0, 0], normal: [0.3, 1, 0.2], sun: [-3, 4, -2], darkness: 0.6, bands: [[0.8, 2.6]] },
  { center: [1, -0.5, 0.25], normal: [-0.2, 1, -0.4], sun: [2, 4, 3], darkness: 0.95, bands: [[0.5, 1.0], [1.5, 2.0], [2.8, 3.6]] }
];
const caseIndex = Math.max(0, Math.min(CASES.length - 1, Number(params.get("case") || 0) | 0));
const cfg = CASES[caseIndex];

window.__p3 = { done: false, error: null };

function bandArray() {
  const out = new Float32Array(20);
  cfg.bands.forEach((band, i) => { out[i * 2] = band[0]; out[i * 2 + 1] = band[1]; });
  return out;
}

function makeGlslMaterial() {
  const glsl = globalThis.__RING_SHADOW_RECEIVER_GLSL;
  if (!glsl) throw new Error("ringShadowReceiverGlsl() was not loaded");
  return new THREE.ShaderMaterial({
    name: "P3 ring-shadow receiver GLSL reference",
    uniforms: {
      uRingCenter: { value: new THREE.Vector3(...cfg.center) },
      uRingNormal: { value: new THREE.Vector3(...cfg.normal) },
      uRingInner: { value: cfg.bands[0]?.[0] ?? 0 },
      uRingOuter: { value: cfg.bands[cfg.bands.length - 1]?.[1] ?? 0 },
      uRingShadow: { value: cfg.darkness },
      uRingBands: { value: bandArray() },
      uRingBandCount: { value: cfg.bands.length },
      uSunPos: { value: new THREE.Vector3(...cfg.sun) }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      ${glsl}
      void main() {
        vec3 p = uRingCenter + vec3((vUv.x * 2.0 - 1.0) * 4.0,
                                     -1.0 + (vUv.y * 2.0 - 1.0) * 0.35,
                                     (vUv.y * 2.0 - 1.0) * 4.0);
        float f = ringShadowReceiverFactor(p);
        float shadow = (1.0 - f) / uRingShadow;
        gl_FragColor = vec4(f, shadow, f * f, 1.0);
      }
    `
  });
}

function makeTslMaterial() {
  const material = new MeshBasicNodeMaterial({ name: "P3 ring-shadow receiver TSL" });
  const pUv = uv();
  const center = vec3(...cfg.center);
  const offset = vec3(
    pUv.x.mul(2.0).sub(1.0).mul(4.0),
    float(-1.0).add(pUv.y.mul(2.0).sub(1.0).mul(0.35)),
    pUv.y.mul(2.0).sub(1.0).mul(4.0)
  );
  const f = ringShadowReceiverFactor(
    center.add(offset),
    center,
    vec3(...cfg.normal),
    vec3(...cfg.sun),
    float(cfg.darkness),
    cfg.bands
  );
  const shadow = float(1.0).sub(f).div(cfg.darkness);
  material.colorNode = vec4(f, shadow, f.mul(f), float(1.0));
  return material;
}

try {
  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    requestedBackend: impl === "glsl" ? "webgl" : undefined,
    antialias: false,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: false
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;

  let scene, camera, mesh, material;
  if (impl === "glsl") {
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeGlslMaterial();
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  } else {
    scene = new NodeScene();
    camera = new NodeOrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeTslMaterial();
    mesh = new NodeMesh(new NodePlaneGeometry(2, 2), material);
  }
  scene.add(mesh);

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p3 = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    caseIndex,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererCtor: renderer.constructor?.name || null,
    materialType: material.type,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P3 ring-shadow receiver ${impl} case ${caseIndex}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p3 = { done: true, error: String(e?.stack || e), revision: REVISION, impl, caseIndex };
  status.textContent = "P3 ring-shadow receiver error: " + window.__p3.error;
}
</script>
</body>
</html>
