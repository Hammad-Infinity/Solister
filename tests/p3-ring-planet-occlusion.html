<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P3 — ring/planet occlusion GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P3 ring/planet occlusion starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { ringPlanetOccluded } from "../src/shaders/ring-planet-occlusion.tsl.js";
import * as THREE from "three";
import {
  Scene as NodeScene,
  OrthographicCamera as NodeOrthographicCamera,
  PlaneGeometry as NodePlaneGeometry,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  REVISION
} from "three/webgpu";
import { uv, vec3, vec4, float, mat3, cos, sin, mix, select } from "three/tsl";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");
const CAMERA_POS = [0, 0, 5];
const CASES = [
  { center: [0, 0, 0], radius: 1.0, axes: [1, 1, 1], Euler: [0, 0, 0], fragZ: -2.0 },
  { center: [0.35, -0.2, 0], radius: 1.15, axes: [1, 0.65, 0.85], Euler: [0, 0, 0.6], fragZ: -2.2 },
  { center: [-0.4, 0.25, -0.3], radius: 1.2, axes: [0.85, 1, 0.65], Euler: [0.5, -0.35, 0.25], fragZ: -2.4 }
];
const caseIndex = Math.max(0, Math.min(CASES.length - 1, Number(params.get("case") || 0) | 0));
const cfg = CASES[caseIndex];

window.__p3 = { done: false, error: null };

function makeInvRot() {
  const m4 = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...cfg.Euler));
  return new THREE.Matrix3().setFromMatrix4(m4);
}

async function loadRingPlanetOcclusionGlsl() {
  // Extract the exact production helper. (The file also creates THREE
  // scratch objects at top level, so it cannot be classic-loaded into this
  // bare harness; extraction avoids a copied shader.)
  const text = await fetch("../src/shaders/ring-planet-occlusion.glsl.js").then(r => {
    if (!r.ok) throw new Error("ring-planet-occlusion fetch failed: " + r.status);
    return r.text();
  });
  const marker = "const RING_PLANET_OCCLUSION_GLSL = `";
  const start = text.indexOf(marker);
  if (start < 0) throw new Error("RING_PLANET_OCCLUSION_GLSL not found");
  const tick = start + marker.length - 1;
  const end = text.indexOf("`;", tick);
  if (end < 0) throw new Error("RING_PLANET_OCCLUSION_GLSL terminator not found");
  return Function("return " + text.slice(tick, end + 1))();
}

function makeGlslMaterial(glsl) {
  return new THREE.ShaderMaterial({
    name: "P3 ring/planet occlusion GLSL reference",
    uniforms: {
      uOccCenter: { value: new THREE.Vector3(...cfg.center) },
      uOccRadius: { value: cfg.radius },
      uOccInvRot: { value: makeInvRot() },
      uOccAxes: { value: new THREE.Vector3(...cfg.axes) },
      uFragZ: { value: cfg.fragZ }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform vec3 uOccCenter;
      uniform float uOccRadius;
      uniform mat3 uOccInvRot;
      uniform vec3 uOccAxes;
      uniform float uFragZ;
      ${glsl}
      void main() {
        float ang = vUv.x * 6.28318530718;
        float rad = mix(1.1, 3.0, vUv.y);
        vec3 p = vec3(
          uOccCenter.x + cos(ang) * rad,
          uOccCenter.y + sin(ang) * rad,
          uFragZ + (vUv.y - 0.5) * 0.1
        );
        bool occluded = ringPlanetOccluded(p, cameraPosition, uOccCenter, uOccRadius, uOccInvRot, uOccAxes);
        float vis = occluded ? 0.0 : 1.0;
        gl_FragColor = vec4(vis, 1.0 - vis, vis * vis, 1.0);
      }
    `
  });
}

function makeTslMaterial() {
  const material = new MeshBasicNodeMaterial({ name: "P3 ring/planet occlusion TSL" });
  const pUv = uv();
  const center = vec3(...cfg.center);
  const ang = pUv.x.mul(6.28318530718);
  const rad = mix(float(1.1), float(3.0), pUv.y);
  const p = vec3(
    float(cfg.center[0]).add(cos(ang).mul(rad)),
    float(cfg.center[1]).add(sin(ang).mul(rad)),
    float(cfg.fragZ).add(pUv.y.sub(0.5).mul(0.1))
  );
  const e = makeInvRot().elements; // column-major
  const invRot = mat3(
    vec3(e[0], e[1], e[2]),
    vec3(e[3], e[4], e[5]),
    vec3(e[6], e[7], e[8])
  );
  const occluded = ringPlanetOccluded(
    p,
    vec3(...CAMERA_POS),
    center,
    float(cfg.radius),
    invRot,
    vec3(...cfg.axes)
  );
  const vis = select(occluded, float(0.0), float(1.0));
  material.colorNode = vec4(vis, float(1.0).sub(vis), vis.mul(vis), float(1.0));
  return material;
}

try {
  const ringPlanetOcclusionGlsl = impl === "glsl" ? await loadRingPlanetOcclusionGlsl() : "";
  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    requestedBackend: impl === "glsl" ? "webgl" : undefined,
    antialias: false,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: false
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;

  let scene, camera, mesh, material;
  if (impl === "glsl") {
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
    camera.position.set(...CAMERA_POS);
    material = makeGlslMaterial(ringPlanetOcclusionGlsl);
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  } else {
    scene = new NodeScene();
    camera = new NodeOrthographicCamera(-1, 1, 1, -1, 0, 10);
    camera.position.set(...CAMERA_POS);
    material = makeTslMaterial();
    mesh = new NodeMesh(new NodePlaneGeometry(2, 2), material);
  }
  scene.add(mesh);

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p3 = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    caseIndex,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererCtor: renderer.constructor?.name || null,
    materialType: material.type,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P3 ring/planet occlusion ${impl} case ${caseIndex}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p3 = { done: true, error: String(e?.stack || e), revision: REVISION, impl, caseIndex };
  status.textContent = "P3 ring/planet occlusion error: " + window.__p3.error;
}
</script>
</body>
</html>
