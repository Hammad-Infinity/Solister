<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P5e17 — comet layer jet plume GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P5e17 comet-jet starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { createPlume, writePlume } from "../src/bodies/small-bodies/comet-plume.js";
import { createCometPlume } from "../src/bodies/small-bodies/comet-plume.tsl.js";
import * as THREE from "three";
import * as NodeNS from "three/webgpu";
import { vec4 } from "three/tsl";
import {
  Scene as NodeScene,
  PerspectiveCamera as NodePerspectiveCamera,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  SphereGeometry as NodeSphereGeometry,
  DoubleSide as NodeDoubleSide,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  Color as NodeColor,
  REVISION
} from "three/webgpu";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");

// The comet layer's jet plume: production's plume ribbon after
// comet-layer.js's fragment-string surgery (phase + transmission
// uniforms, the travelling packet factor in the alpha) against
// the TSL port's jetPackets build option. The classic side runs
// production's createPlume/writePlume mesh with the surgery
// applied verbatim — the two replace() argument pairs are
// extracted from comet-layer.js at runtime and applied in
// order, with anchor hits asserted. The node side builds the
// identical tube through the same production code in the
// webgpu namespace and swaps in the port's material. All jets
// use the production segment count (16).
// Cases:
//   0 jet at rest (phase 0, transmission 1)
//   1 streaming jet attenuated by the coma (transmission 0.4)
//   2 late phase on a flattened ribbon
//   3 faint jet with an emission ramp (packet minima against
//     the discard threshold)
//   4 jet + occluder spheres (the plume's log depth ordering)
const NEAR = 0.1;
const FAR = 5000;

function arcPoints(segments, fn) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const p = fn(t);
    pts.push(p[0], p[1], p[2]);
  }
  return pts;
}

const CASES = [
  {
    kind: "jet-rest", segments: 16, flatten: 1, tint: 16117475, opacity: 0.8, rad: 0.5,
    phase: 0, transmission: 1,
    points: s => arcPoints(s, t => [-9 + 18 * t, -2.5 + 4 * Math.sin(t * Math.PI * 0.7), -26 + 6 * t])
  },
  {
    kind: "jet-streaming", segments: 16, flatten: 1, tint: 16117475, opacity: 0.9, rad: 0.5,
    phase: 3.7, transmission: 0.4,
    points: s => arcPoints(s, t => [-9 + 18 * t, -2.5 + 4 * Math.sin(t * Math.PI * 0.7), -26 + 6 * t])
  },
  {
    kind: "jet-late-phase", segments: 16, flatten: 0.35, tint: 15269875, opacity: 0.55, rad: 0.85,
    phase: 12.25, transmission: 0.85,
    points: s => arcPoints(s, t => [-8 + 15 * t, 3 - 6 * t * t, -24 + 3 * Math.sin(t * 5)])
  },
  {
    kind: "jet-faint", segments: 16, flatten: 1, tint: 16117475, opacity: 0.3, rad: 0.6, emissionRamp: true,
    phase: 24.625, transmission: 0.7,
    points: s => arcPoints(s, t => [-9 + 18 * t, -2.5 + 4 * Math.sin(t * Math.PI * 0.7), -26 + 6 * t])
  },
  {
    kind: "jet-occluders", segments: 16, flatten: 1, tint: 16117475, opacity: 0.85, rad: 2.2, occluders: true,
    phase: 7.3, transmission: 0.6,
    points: s => arcPoints(s, t => [-30 + 60 * t, -4 + 9 * Math.sin(t * Math.PI * 0.8), -100 + 6 * t])
  }
];
const caseIndex = Math.max(0, Math.min(CASES.length - 1, Number(params.get("case") || 0) | 0));
const cfg = CASES[caseIndex];

const OCCLUDERS = [
  { pos: [10, 4, -40], r: 10 },
  { pos: [-28, -12, -400], r: 80 }
];

window.__p5jet = { done: false, error: null };


// Extracts production's jet surgery from comet-layer.js: the two
// .replace(from, to) argument pairs on the fragmentShader
// assignment line, as literal strings.
async function loadJetSurgery() {
  const text = await fetch("../src/bodies/small-bodies/comet-layer.js").then(r => {
    if (!r.ok) throw new Error("comet-layer.js fetch failed: " + r.status);
    return r.text();
  });
  const at = text.indexOf("material.fragmentShader = ");
  if (at < 0) throw new Error("jet surgery line not found");
  const lineEnd = text.indexOf("\n", at);
  const line = text.slice(at, lineEnd);
  const pairs = [];
  const re = /\.replace\("((?:[^"\\]|\\.)*)",\s*"((?:[^"\\]|\\.)*)"\)/g;
  let m;
  while ((m = re.exec(line)) !== null) {
    pairs.push([JSON.parse('"' + m[1] + '"'), JSON.parse('"' + m[2] + '"')]);
  }
  if (pairs.length !== 2) throw new Error("expected 2 surgery replaces, got " + pairs.length);
  return pairs;
}

function applyJetSurgery(material, pairs) {
  material.uniforms.transmission = { value: 1 };
  material.uniforms.phase = { value: 0 };
  let shader = material.fragmentShader;
  for (const [from, to] of pairs) {
    const next = shader.replace(from, to);
    if (next === shader) throw new Error("surgery anchor missed: " + from);
    shader = next;
  }
  if (!shader.includes("packets") || !shader.includes("uniform float phase;uniform float transmission;"))
    throw new Error("surgeried fragment does not look like production");
  material.fragmentShader = shader;
  material.uniforms.phase.value = cfg.phase;
  material.uniforms.transmission.value = cfg.transmission;
}

function widthFn(rad) {
  return u => rad * (0.1 + 3.5 * Math.pow(u, 0.7));
}

function applyEmissionRamp(geometry, segments) {
  const attr = geometry.attributes.aEmission;
  const radialPlus = 41;
  for (let i = 0; i <= segments; i++) {
    for (let j = 0; j < radialPlus; j++) {
      attr.setX(i * radialPlus + j, (i / segments) * 1.6);
    }
  }
  attr.needsUpdate = true;
}

function makeCamera(isNode) {
  const camera = new (isNode ? NodePerspectiveCamera : THREE.PerspectiveCamera)(50, 1, NEAR, FAR);
  camera.position.set(0, 0, 0);
  camera.lookAt(0, 0, -1);
  return camera;
}

function buildGlslScene(surgery) {
  const scene = new THREE.Scene();
  const camera = makeCamera(false);
  scene.add(camera);
  if (cfg.occluders) {
    for (const o of OCCLUDERS) {
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 0.32, 0.36) });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(o.r, 48, 32), mat);
      mesh.position.set(...o.pos);
      scene.add(mesh);
    }
  }
  const plume = createPlume(THREE, cfg.tint, cfg.segments, cfg.flatten);
  applyJetSurgery(plume.material, surgery);
  writePlume(plume, cfg.points(cfg.segments), widthFn(cfg.rad), cfg.opacity);
  plume.frustumCulled = false;
  if (cfg.emissionRamp) applyEmissionRamp(plume.geometry, cfg.segments);
  scene.add(plume);
  return { scene, camera };
}

function buildTslScene() {
  const scene = new NodeScene();
  const camera = makeCamera(true);
  scene.add(camera);
  if (cfg.occluders) {
    for (const o of OCCLUDERS) {
      const material = new MeshBasicNodeMaterial({ name: "P5e12 occluder TSL" });
      material.colorNode = vec4(0.3, 0.32, 0.36, 1.0);
      const mesh = new NodeMesh(new NodeSphereGeometry(o.r, 48, 32), material);
      mesh.position.set(...o.pos);
      scene.add(mesh);
    }
  }
  // Geometry from production's own factory in the webgpu
  // namespace (its ShaderMaterial is discarded unused).
  const donor = createPlume(NodeNS, cfg.tint, cfg.segments, cfg.flatten);
  writePlume(donor, cfg.points(cfg.segments), widthFn(cfg.rad), cfg.opacity);
  if (cfg.emissionRamp) applyEmissionRamp(donor.geometry, cfg.segments);
  const slots = createCometPlume({
    color: new NodeColor(cfg.tint),
    opacity: cfg.opacity,
    startFade: 0.003,
    jetPackets: true,
    phase: cfg.phase,
    transmission: cfg.transmission
  });
  const material = new MeshBasicNodeMaterial({ name: "P5e17 comet jet TSL" });
  material.transparent = true;
  material.depthWrite = false;
  material.depthTest = true;
  material.side = NodeDoubleSide;
  material.toneMapped = false;
  material.vertexNode = slots.vertexNode;
  material.colorNode = slots.colorNode;
  material.depthNode = slots.depthNode;
  const mesh = new NodeMesh(donor.geometry, material);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { scene, camera };
}

try {
  const surgery = await loadJetSurgery();
  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    antialias: true,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: true
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;
  renderer.setClearColor(impl === "tsl" ? new NodeColor(0, 0, 0) : new THREE.Color(0, 0, 0), 1);

  const { scene, camera } = impl === "glsl" ? buildGlslScene(surgery) : buildTslScene();

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p5jet = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    caseIndex,
    kind: cfg.kind,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererLogDepth: renderer.logarithmicDepthBuffer ?? renderer.capabilities?.logarithmicDepthBuffer ?? null,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P5e17 comet-jet ${impl} case ${caseIndex}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p5jet = { done: true, error: String(e?.stack || e), revision: REVISION, impl, caseIndex };
  status.textContent = "P5e17 comet-jet error: " + window.__p5jet.error;
}
</script>
</body>
</html>
