<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P5e13 — comet occlusion provider GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P5e13 comet-occlusion starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { COMET_OCCLUSION_SHADER } from "../src/bodies/small-bodies/comet-occlusion.js";
import { createCometOcclusion } from "../src/bodies/small-bodies/comet-occlusion.tsl.js";
import * as THREE from "three";
import * as NodeNS from "three/webgpu";
import {
  uniform as tslUniform, varying as tslVarying, cameraProjectionMatrix,
  modelViewMatrix, positionGeometry, vec4, normalize, max, clamp, float, select
} from "three/tsl";
import {
  Scene as NodeScene,
  PerspectiveCamera as NodePerspectiveCamera,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  BoxGeometry as NodeBoxGeometry,
  SphereGeometry as NodeSphereGeometry,
  BackSide as NodeBackSide,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  Color as NodeColor,
  REVISION
} from "three/webgpu";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");

// The comet occlusion provider (sphere hit / nucleus pixel test /
// ray limit / written depth) against production's imported
// COMET_OCCLUSION_SHADER. Both sides run a consumer-shaped
// harness: a BackSide unit box with the production volume vertex
// (vLocal = position), eye in local space, output encoding
// R = ray-limited span, G = nucleus-pixel flag, B = unlimited
// span, and the written depth set at the ray entry exactly as
// the volume consumers do it.
// Cases:
//   0 no occluders, no nucleus depth (R == B baseline)
//   1 three occluder spheres clip the ray finish
//   2 same array but occluderCount 2 (the loop guard)
//   3 nucleus depth texture under an offset viewport rect
//     (gl_FragCoord conversion + packed-depth clamp, opacity 1)
//   4 nucleus opacity 0.5 (pixel test off, ray limit mixed)
//   5 written-depth discriminator: opaque spheres in the
//     scene's log depth at 8 and 40 units; production writes
//     LINEAR depth (~0.992 at the entry), so the volume loses
//     to BOTH — a log-depth port would wrongly win over the
//     40-unit sphere
const NEAR = 0.1;
const FAR = 5000;
const BOX_POS = [0, 0, -26];
const BOX_SCALE = 13;
const EYE_LOCAL = [0, 0, 2.0];
const OCCLUDERS = [
  [0.1, 0.0, 0.1, 0.35],
  [-0.45, 0.3, -0.2, 0.28],
  [0.45, -0.35, 0.25, 0.3]
];
const CASES = [
  { kind: "provider-basic", count: 0, hasDepth: false, opacity: 1, depthRange: 1.6, viewport: [0, 0, 256, 256] },
  { kind: "occluders-3", count: 3, hasDepth: false, opacity: 1, depthRange: 1.6, viewport: [0, 0, 256, 256] },
  { kind: "occluders-count2", count: 2, hasDepth: false, opacity: 1, depthRange: 1.6, viewport: [0, 0, 256, 256] },
  { kind: "nucleus-disc", count: 0, hasDepth: true, opacity: 1, depthRange: 1.6, viewport: [40, 150, 150, 80] },
  { kind: "nucleus-half", count: 0, hasDepth: true, opacity: 0.5, depthRange: 1.6, viewport: [40, 150, 150, 80] },
  { kind: "depth-occluders", count: 0, hasDepth: false, opacity: 1, depthRange: 1.6, viewport: [0, 0, 256, 256], spheres: true }
];
const caseIndex = Math.max(0, Math.min(CASES.length - 1, Number(params.get("case") || 0) | 0));
const cfg = CASES[caseIndex];

window.__p5occ = { done: false, error: null };

async function loadProductionVertex() {
  const text = await fetch("../src/bodies/small-bodies/comet-volume.js").then(r => {
    if (!r.ok) throw new Error("comet-volume.js fetch failed: " + r.status);
    return r.text();
  });
  const tickChar = String.fromCharCode(96);
  const at = text.indexOf("const VERTEX_SHADER =");
  const tick = text.indexOf(tickChar, at);
  const end = text.indexOf(tickChar, tick + 1);
  if (at < 0 || tick < 0 || end < 0) throw new Error("volume vertex literal not found");
  const vertex = Function("return " + text.slice(tick, end + 1))();
  if (!vertex.includes("vLocal = position")) throw new Error("extracted vertex does not look like production");
  return vertex;
}

const HARNESS_FRAG_TAIL = `
varying vec3 vLocal;
uniform vec3 eye;
uniform float displayScale;
void main() {
    vec3 direction = normalize(vLocal - eye);
    vec2 hit = cometSphereHit(eye, direction, 1.0);
    float start = max(0.0, hit.x);
    float finish = cometRayLimit(eye, direction, hit.y);
    cometWriteDepth(eye, direction, start);
    float pix = cometNucleusPixel() ? 1.0 : 0.0;
    float span = clamp((max(finish, start) - start) / displayScale, 0.0, 1.0);
    float spanFull = clamp((max(hit.y, start) - start) / displayScale, 0.0, 1.0);
    gl_FragColor = vec4(span, pix * 0.85 + 0.1, spanFull, 1.0);
}`;

// Asymmetric packed-depth test texture: white background
// ("no nucleus"), one off-centre disc with a radial byte ramp
// and G stripes, so any axis/orientation mistake is visible.
function makeDepthTexture(T) {
  const w = 64, h = 64;
  const data = new Uint8Array(w * h * 4).fill(255);
  const cx = 20, cy = 44, r = 12;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d < r) {
        const p = (y * w + x) * 4;
        data[p] = Math.max(0, Math.min(255, Math.round(120 + d * 10)));
        data[p + 1] = (x * 7) % 251;
        data[p + 2] = 77;
        data[p + 3] = 200;
      }
    }
  }
  const tex = new T.DataTexture(data, w, h, T.RGBAFormat);
  tex.minFilter = T.NearestFilter;
  tex.magFilter = T.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function makeCamera(isNode) {
  const camera = new (isNode ? NodePerspectiveCamera : THREE.PerspectiveCamera)(50, 1, NEAR, FAR);
  camera.position.set(0, 0, 0);
  camera.lookAt(0, 0, -1);
  camera.updateMatrixWorld(true);
  return camera;
}

function localToClipOf(camera, mesh) {
  const m = new THREE.Matrix4()
    .multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)
    .multiply(mesh.matrixWorld);
  return m;
}

function placeBox(mesh) {
  mesh.position.set(...BOX_POS);
  mesh.scale.setScalar(BOX_SCALE);
  mesh.frustumCulled = false;
  mesh.updateMatrixWorld(true);
  return mesh;
}

function addSpheres(scene, isNode) {
  const defs = [
    { pos: [6, 3, -8], r: 2.5 },
    { pos: [0, 0, -40], r: 9 }
  ];
  for (const o of defs) {
    let mesh;
    if (isNode) {
      const material = new MeshBasicNodeMaterial({ name: "P5e13 sphere TSL" });
      material.colorNode = vec4(0.3, 0.32, 0.36, 1.0);
      mesh = new NodeMesh(new NodeSphereGeometry(o.r, 48, 32), material);
    } else {
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 0.32, 0.36) });
      mesh = new THREE.Mesh(new THREE.SphereGeometry(o.r, 48, 32), mat);
    }
    mesh.position.set(...o.pos);
    scene.add(mesh);
  }
}

function buildGlslScene(prodVertex) {
  const scene = new THREE.Scene();
  const camera = makeCamera(false);
  scene.add(camera);
  if (cfg.spheres) addSpheres(scene, false);
  const occluders = Array.from({ length: 12 }, () => new THREE.Vector4());
  OCCLUDERS.forEach((o, i) => occluders[i].set(...o));
  const material = new THREE.ShaderMaterial({
    name: "P5e13 occlusion harness GLSL",
    uniforms: {
      nucleusOpacity: { value: cfg.opacity },
      localToClip: { value: new THREE.Matrix4() },
      nucleusDepth: { value: makeDepthTexture(THREE) },
      depthViewport: { value: new THREE.Vector4(...cfg.viewport) },
      depthRange: { value: cfg.depthRange },
      hasNucleusDepth: { value: cfg.hasDepth },
      occluderCount: { value: cfg.count },
      occluders: { value: occluders },
      eye: { value: new THREE.Vector3(...EYE_LOCAL) },
      displayScale: { value: 2.0 }
    },
    vertexShader: prodVertex,
    fragmentShader: "#include <common>\n" + COMET_OCCLUSION_SHADER + HARNESS_FRAG_TAIL,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    side: THREE.BackSide,
    toneMapped: false,
    fog: false,
    extensions: { derivatives: true, fragDepth: true }
  });
  const mesh = placeBox(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), material));
  material.uniforms.localToClip.value.copy(localToClipOf(camera, mesh));
  scene.add(mesh);
  return { scene, camera };
}

function buildTslScene() {
  const scene = new NodeScene();
  const camera = makeCamera(true);
  scene.add(camera);
  if (cfg.spheres) addSpheres(scene, true);
  const geometry = new NodeBoxGeometry(2, 2, 2);
  const occluders = Array.from({ length: 12 }, () => new NodeNS.Vector4());
  OCCLUDERS.forEach((o, i) => occluders[i].set(...o));
  // localToClip from the same rig matrices (classic math source).
  const probe = placeBox(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshBasicMaterial()));
  const classicCam = makeCamera(false);
  const m4 = localToClipOf(classicCam, probe);
  const nodeM4 = new NodeNS.Matrix4().fromArray(m4.elements);

  const occlusion = createCometOcclusion({
    nucleusDepth: makeDepthTexture(NodeNS),
    localToClip: nodeM4,
    depthViewport: cfg.viewport,
    depthRange: cfg.depthRange,
    hasNucleusDepth: cfg.hasDepth,
    nucleusOpacity: cfg.opacity,
    occluderCount: cfg.count,
    occluders
  });

  const eye = tslUniform(new NodeNS.Vector3(...EYE_LOCAL));
  const mv = modelViewMatrix.mul(vec4(positionGeometry, 1.0)).toVar();
  const vLocal = tslVarying(positionGeometry);
  const direction = normalize(vLocal.sub(eye)).toVar();
  const hit = occlusion.cometSphereHit(eye, direction, float(1.0)).toVar();
  const start = max(float(0.0), hit.x).toVar();
  const finish = occlusion.cometRayLimit(eye, direction, hit.y).toVar();
  const pix = select(occlusion.cometNucleusPixel(), float(1.0), float(0.0));
  const span = clamp(max(finish, start).sub(start).div(2.0), float(0.0), float(1.0));
  const spanFull = clamp(max(hit.y, start).sub(start).div(2.0), float(0.0), float(1.0));

  const material = new MeshBasicNodeMaterial({ name: "P5e13 occlusion harness TSL" });
  material.transparent = true;
  material.depthWrite = false;
  material.depthTest = true;
  material.side = NodeBackSide;
  material.toneMapped = false;
  material.vertexNode = cameraProjectionMatrix.mul(mv);
  material.colorNode = vec4(span, pix.mul(0.85).add(0.1), spanFull, 1.0);
  material.depthNode = occlusion.cometOcclusionDepth(eye, direction, start);
  const mesh = placeBox(new NodeMesh(geometry, material));
  scene.add(mesh);
  return { scene, camera };
}

try {
  const prodVertex = await loadProductionVertex();
  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    antialias: true,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: true
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;
  renderer.setClearColor(impl === "tsl" ? new NodeColor(0, 0, 0) : new THREE.Color(0, 0, 0), 1);

  const { scene, camera } = impl === "glsl" ? buildGlslScene(prodVertex) : buildTslScene();

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p5occ = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    caseIndex,
    kind: cfg.kind,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererLogDepth: renderer.logarithmicDepthBuffer ?? renderer.capabilities?.logarithmicDepthBuffer ?? null,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P5e13 comet-occlusion ${impl} case ${caseIndex}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p5occ = { done: true, error: String(e?.stack || e), revision: REVISION, impl, caseIndex };
  status.textContent = "P5e13 comet-occlusion error: " + window.__p5occ.error;
}
</script>
</body>
</html>
