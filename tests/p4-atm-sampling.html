<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P4 — atmosphere sampling GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P4 atmosphere sampling starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { AtmRay, createAtmSampling } from "../src/shaders/atm-sampling.tsl.js";
import * as THREE from "three";
import * as NodeTHREE from "three/webgpu";
import {
  Scene as NodeScene,
  OrthographicCamera as NodeOrthographicCamera,
  PlaneGeometry as NodePlaneGeometry,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  REVISION
} from "three/webgpu";
import {
  Fn, uv, vec2, vec3, vec4, float,
  dot, floor, fract, length, max, mix, normalize, select, sqrt
} from "three/tsl";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");
const CASES = [
  { eyeR: 33166.3, axis: [1, 1, 1], colAdjust: [0, 1], scatterBright: 1 },
  { eyeR: 12000.0, axis: [1, 1.11, 1], colAdjust: [0.03, 1.15], scatterBright: 0.9 },
  { eyeR: 7200.0, axis: [1, 0.94, 1], colAdjust: [-0.02, 0.85], scatterBright: 1.07 }
];
const caseIndex = Math.max(0, Math.min(CASES.length - 1, Number(params.get("case") || 0) | 0));
const cfg = CASES[caseIndex];
const forcedBand = params.has("band") ? Math.max(0, Math.min(7, Number(params.get("band") || 0) | 0)) : -1;

window.__p4 = { done: false, error: null };

function loadClassic(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error("failed to load " + src));
    document.head.appendChild(script);
  });
}

function makeGlslMaterial(table) {
  const uniforms = globalThis.atmSamplingUniforms(THREE, table.header, table);
  uniforms.uAtmAxisScale.value.set(...cfg.axis);
  uniforms.uAtmColAdjust.value.set(...cfg.colAdjust);
  uniforms.uAtmScatterBright.value = cfg.scatterBright;

  return new THREE.ShaderMaterial({
    name: "P4 atmosphere sampling GLSL reference",
    uniforms,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp sampler3D;
      varying vec2 vUv;
      ${globalThis.ATM_SAMPLING_GLSL}
      void main() {
        float row = ${forcedBand >= 0 ? forcedBand.toFixed(1) : "floor(vUv.y * 8.0)"};
        vec2 q = ${forcedBand >= 0 ? "vUv" : "vec2(vUv.x, fract(vUv.y * 8.0))"};
        float eyeR = ${cfg.eyeR.toFixed(1)};
        float rg = uAtmRadii.x;
        float horizon = -sqrt(max(1.0 - (rg / eyeR) * (rg / eyeR), 0.0));
        float delta = mix(-(1.0 + horizon) * 0.85, 0.025, q.x);
        float mu = horizon + delta;
        float st = sqrt(max(1.0 - mu * mu, 0.0));
        vec3 eyePos = vec3(0.0, 0.0, eyeR);
        vec3 viewDir = vec3(st, 0.0, mu);
        float b = eyeR * mu;
        float disc = b * b - (eyeR * eyeR - rg * rg);
        float viewLen = disc > 0.0 ? -b - sqrt(disc) : max(-b, 0.0);
        vec3 fragPos = eyePos + viewDir * viewLen;
        float fragR = length(fragPos);
        float fragMu = dot(fragPos, viewDir) / fragR;
        float nuInput = mix(-0.95, 0.95, q.y);
        vec3 sun = normalize(vec3(
          viewDir.x * nuInput + sqrt(max(1.0 - nuInput * nuInput, 0.0)),
          0.0,
          viewDir.z * nuInput
        ));

        AtmRay ray;
        ray.eyePos = eyePos;
        ray.eyeR = eyeR;
        ray.eyeMu = mu;
        ray.viewDir = viewDir;
        ray.viewLen = viewLen;
        ray.fragPos = fragPos;
        ray.fragR = fragR;
        ray.fragMu = fragMu;

        vec3 attenuation = atmTransmittanceSegment(eyeR, mu, fragR, fragMu);
        float eyeMuS = dot(eyePos, sun) / eyeR;
        float nu = dot(viewDir, sun);
        vec4 table = atmTable4D(eyeR, mu, eyeMuS, nu);

        vec3 outColor = vec3(0.0);
        if (row < 0.5) {
          outColor = table.rgb * 0.55;
        } else if (row < 1.5) {
          float rDirect = mix(uAtmRadii.x, uAtmRadii.y, q.y);
          float muDirect = mix(-0.2, 1.0, q.x);
          outColor = vec3(
            table.a * 0.55,
            atmTransmittance(rDirect, muDirect).g,
            atmIrradiance(q.y, muDirect).b * 5.0
          );
        } else if (row < 2.5) {
          outColor = attenuation;
        } else if (row < 3.5) {
          outColor = atmInscatterGround(ray, sun, attenuation) * 5.0;
        } else if (row < 4.5) {
          outColor = atmInscatterGroundFix(ray, sun, attenuation, 1e-3) * 5.0;
        } else if (row < 5.5) {
          outColor = atmInscatterSky(atmSkyRay(eyePos, viewDir), sun) * 5.0;
        } else if (row < 6.5) {
          outColor = atmInscatterSky(ray, sun) * 5.0;
        } else {
          vec3 tableVec = atmToTable(vec3(q.x * 2.0 - 1.0, q.y * 2.0 - 1.0, 0.35));
          outColor = vec3(
            atmPhaseR(nu) * 6.0,
            atmPhaseM(nu) * 0.3,
            length(tableVec) * 0.35
          );
        }
        gl_FragColor = vec4(outColor, 1.0);
      }
    `
  });
}

function makeTslMaterial(table) {
  const header = table.header;
  const sampling = createAtmSampling({
    inscatter: table.s,
    transmittance: table.t,
    irradiance: table.e,
    radii: [
      header.groundRadiusKm,
      header.topRadiusKm,
      header.rayleighScaleHeightKm,
      header.mieScaleHeightKm
    ],
    betaR: header.rayleighBeta,
    betaMieExt: header.mieExtinctionBeta,
    mie: [header.mieG, header.mieFade],
    axisScale: cfg.axis,
    colAdjust: cfg.colAdjust,
    scatterBright: cfg.scatterBright
  });

  const material = new MeshBasicNodeMaterial({ name: "P4 atmosphere sampling TSL" });
  const shade = Fn(() => {
    const pUv = uv();
    const row = forcedBand >= 0 ? float(forcedBand) : floor(pUv.y.mul(8.0));
    const q = forcedBand >= 0 ? pUv : vec2(pUv.x, fract(pUv.y.mul(8.0)));

    const eyeR = float(cfg.eyeR);
    const rg = sampling.radii.x;
    const horizon = sqrt(max(
      float(1.0).sub(rg.div(eyeR).mul(rg.div(eyeR))),
      float(0.0)
    )).mul(-1.0);
    const delta = mix(float(1.0).add(horizon).mul(-0.85), float(0.025), q.x);
    const mu = horizon.add(delta).toVar("atmMu");
    const st = sqrt(max(float(1.0).sub(mu.mul(mu)), float(0.0)));
    const eyePos = vec3(0.0, 0.0, eyeR).toVar("atmEyePos");
    const viewDir = vec3(st, 0.0, mu).toVar("atmViewDir");

    const b = eyeR.mul(mu);
    const disc = b.mul(b).sub(eyeR.mul(eyeR).sub(rg.mul(rg)));
    const viewLen = select(
      disc.greaterThan(0.0),
      b.mul(-1.0).sub(sqrt(max(disc, float(0.0)))),
      max(b.mul(-1.0), float(0.0))
    ).toVar("atmViewLen");
    const fragPos = eyePos.add(viewDir.mul(viewLen)).toVar("atmFragPos");
    const fragR = length(fragPos).toVar("atmFragR");
    const fragMu = dot(fragPos, viewDir).div(fragR).toVar("atmFragMu");

    const nuInput = mix(float(-0.95), float(0.95), q.y).toVar("atmNuInput");
    const sun = normalize(vec3(
      viewDir.x.mul(nuInput).add(sqrt(max(float(1.0).sub(nuInput.mul(nuInput)), float(0.0)))),
      0.0,
      viewDir.z.mul(nuInput)
    )).toVar("atmSunDir");

    const ray = AtmRay({
      eyePos,
      eyeR,
      eyeMu: mu,
      viewDir,
      viewLen,
      fragPos,
      fragR,
      fragMu
    });

    const attenuation = sampling.atmTransmittanceSegment(eyeR, mu, fragR, fragMu);
    const eyeMuS = dot(eyePos, sun).div(eyeR).toVar("atmEyeMuS");
    const nu = dot(viewDir, sun).toVar("atmNu");
    const tableValue = sampling.atmTable4D(eyeR, mu, eyeMuS, nu);

    const rDirect = mix(sampling.radii.x, sampling.radii.y, q.y);
    const muDirect = mix(float(-0.2), float(1.0), q.x);
    const tableVec = sampling.atmToTable(vec3(
      q.x.mul(2.0).sub(1.0),
      q.y.mul(2.0).sub(1.0),
      0.35
    ));

    const row0 = tableValue.rgb.mul(0.55);
    const row1 = vec3(
      tableValue.a.mul(0.55),
      sampling.atmTransmittance(rDirect, muDirect).g,
      sampling.atmIrradiance(q.y, muDirect).b.mul(5.0)
    );
    const row2 = attenuation;
    const row3 = sampling.atmInscatterGround(ray, sun, attenuation).mul(5.0);
    const row4 = sampling.atmInscatterGroundFix(ray, sun, attenuation, float(1e-3)).mul(5.0);
    const row5 = sampling.atmInscatterSky(sampling.atmSkyRay(eyePos, viewDir), sun).mul(5.0);
    const row6 = sampling.atmInscatterSky(ray, sun).mul(5.0);
    const row7 = vec3(
      sampling.atmPhaseR(nu).mul(6.0),
      sampling.atmPhaseM(nu).mul(0.3),
      length(tableVec).mul(0.35)
    );

    let outColor = row7;
    outColor = select(row.lessThan(6.5), row6, outColor);
    outColor = select(row.lessThan(5.5), row5, outColor);
    outColor = select(row.lessThan(4.5), row4, outColor);
    outColor = select(row.lessThan(3.5), row3, outColor);
    outColor = select(row.lessThan(2.5), row2, outColor);
    outColor = select(row.lessThan(1.5), row1, outColor);
    outColor = select(row.lessThan(0.5), row0, outColor);

    return vec4(outColor, float(1.0));
  });
  material.colorNode = shade();
  return material;
}

try {
  await loadClassic("../src/render/atmosphere/atm-tables.js");
  await loadClassic("../src/shaders/atm-sampling.glsl.js");

  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    requestedBackend: impl === "glsl" ? "webgl" : undefined,
    antialias: false,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: false
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;

  const table = await globalThis.loadAtmTable(
    impl === "tsl" ? NodeTHREE : THREE,
    "earth",
    { url: "../assets/atmosphere/earth.atm.gz" }
  );

  let scene, camera, mesh, material;
  if (impl === "glsl") {
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeGlslMaterial(table);
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  } else {
    scene = new NodeScene();
    camera = new NodeOrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeTslMaterial(table);
    mesh = new NodeMesh(new NodePlaneGeometry(2, 2), material);
  }
  mesh.frustumCulled = false;
  scene.add(mesh);

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p4Debug = { renderer, scene, camera, mesh, material };
  window.__p4 = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    caseIndex,
    header: table.header,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererCtor: renderer.constructor?.name || null,
    materialType: material.type,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P4 atmosphere sampling ${impl} case ${caseIndex}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p4 = { done: true, error: String(e?.stack || e), revision: REVISION, impl, caseIndex };
  status.textContent = "P4 atmosphere sampling error: " + window.__p4.error;
}
</script>
</body>
</html>
