<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<title>Solister P3 — cloud medium GLSL vs TSL</title>
<style>
  html, body { margin: 0; background: #05070c; color: #dfe7ff; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 256px; height: 256px; }
  #status { position: fixed; left: 8px; top: 264px; white-space: pre-wrap; }
</style>
<script src="../src/shaders/cloud-medium.glsl.js"></script>
<script>
  globalThis.__CLOUD_MEDIUM_GLSL = CLOUD_MEDIUM_GLSL;
  globalThis.__CLOUD_EXTINCTION_PER_KM_GLSL = CLOUD_EXTINCTION_PER_KM;
</script>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-r186/three.module.js",
    "three/addons/": "../vendor/three-r186/addons/",
    "three/webgpu": "../vendor/three-r186/three.webgpu.js",
    "three/tsl": "../vendor/three-r186/three.tsl.js"
  }
}
</script>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<div id="status">P3 cloud-medium starting…</div>
<script type="module">
import { createSolisterRenderer } from "../src/app/renderer-runtime.js";
import { cloudChord, cloudTransmittance, CLOUD_EXTINCTION_PER_KM } from "../src/shaders/cloud-medium.tsl.js";
import * as THREE from "three";
import {
  Scene as NodeScene,
  OrthographicCamera as NodeOrthographicCamera,
  PlaneGeometry as NodePlaneGeometry,
  Mesh as NodeMesh,
  MeshBasicNodeMaterial,
  LinearSRGBColorSpace as NodeLinearSRGBColorSpace,
  NoToneMapping as NodeNoToneMapping,
  REVISION
} from "three/webgpu";
import { uv, vec2, vec4, float, step, fract } from "three/tsl";

const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const impl = params.get("impl") === "glsl" ? "glsl" : "tsl";
const size = Math.max(64, Math.min(512, Number(params.get("size") || 256) | 0));
const canvas = document.getElementById("c");
const SHELL = [6387, 6382];

window.__p3 = { done: false, error: null };

function makeGlslMaterial() {
  const glsl = globalThis.__CLOUD_MEDIUM_GLSL;
  if (!glsl) throw new Error("CLOUD_MEDIUM_GLSL was not loaded");
  return new THREE.ShaderMaterial({
    name: "P3 cloud-medium GLSL reference",
    uniforms: {
      uShell: { value: new THREE.Vector2(SHELL[0], SHELL[1]) },
      uExtinction: { value: globalThis.__CLOUD_EXTINCTION_PER_KM_GLSL }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform vec2 uShell;
      uniform float uExtinction;
      ${glsl}
      void main() {
        float inside = step(0.5, vUv.x);
        float mu = fract(vUv.x * 2.0);
        float coverage = vUv.y * 1.6;
        float chord = cloudChord(mu, uShell, inside);
        float transmittance = cloudTransmittance(coverage, chord, uExtinction);
        float thin = cloudTransmittance(coverage * 0.35, chord, uExtinction);
        gl_FragColor = vec4(chord / 256.0, transmittance, thin, 1.0);
      }
    `
  });
}

function makeTslMaterial() {
  const material = new MeshBasicNodeMaterial({ name: "P3 cloud-medium TSL" });
  const p = uv();
  const inside = step(float(0.5), p.x);
  const mu = fract(p.x.mul(2.0));
  const coverage = p.y.mul(1.6);
  const shell = vec2(SHELL[0], SHELL[1]);
  const extinction = float(CLOUD_EXTINCTION_PER_KM);
  const chord = cloudChord(mu, shell, inside);
  const transmittance = cloudTransmittance(coverage, chord, extinction);
  const thin = cloudTransmittance(coverage.mul(0.35), chord, extinction);
  material.colorNode = vec4(chord.div(256.0), transmittance, thin, float(1.0));
  return material;
}

try {
  const handle = await createSolisterRenderer({
    canvas,
    nodeMaterialsReady: impl === "tsl",
    search: location.search,
    requestedBackend: impl === "glsl" ? "webgl" : undefined,
    antialias: false,
    alpha: false,
    stencil: false,
    logarithmicDepthBuffer: false
  });
  if (!handle.renderer) throw handle.error || new Error("renderer seam returned no renderer");
  const renderer = handle.renderer;
  renderer.setPixelRatio(1);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = impl === "tsl" ? NodeLinearSRGBColorSpace : THREE.LinearSRGBColorSpace;
  renderer.toneMapping = impl === "tsl" ? NodeNoToneMapping : THREE.NoToneMapping;

  let scene, camera, mesh, material;
  if (impl === "glsl") {
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeGlslMaterial();
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  } else {
    scene = new NodeScene();
    camera = new NodeOrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    material = makeTslMaterial();
    mesh = new NodeMesh(new NodePlaneGeometry(2, 2), material);
  }
  scene.add(mesh);

  for (let i = 0; i < 5; i++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);
  }

  window.__p3 = {
    done: true,
    error: null,
    revision: REVISION,
    info: handle.info,
    impl,
    sameCanvas: handle.canvas === canvas && renderer.domElement === canvas,
    canvasCount: document.querySelectorAll("canvas").length,
    rendererCtor: renderer.constructor?.name || null,
    materialType: material.type,
    drawCalls: renderer.info?.render?.calls ?? null
  };
  status.textContent = `P3 cloud-medium ${impl}: actual=${handle.info.actualBackend} renderer=${handle.info.rendererKind}`;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (e) {
  window.__p3 = { done: true, error: String(e?.stack || e), revision: REVISION, impl };
  status.textContent = "P3 cloud-medium error: " + window.__p3.error;
}
</script>
</body>
</html>
